claim: >-
  The cited official OCA feast indexes publish the feast-specific propers for
  Vespers, Matins, and Divine Liturgy. A semantic renderer may treat the
  corresponding official index as the complete proper bundle for that feast
  and service while ordinary invariant service material remains in its base
  service template.

locator:
  scope: Twelve major feasts; feast-variable propers only
