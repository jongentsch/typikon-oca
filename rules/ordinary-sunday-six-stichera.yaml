schema: typikon.rule/v0.3

id: ordinary-sunday-six-stichera
when:
  service: great_vespers
  day:
    weekday: sunday
    phase: ordinary
  observance:
    rank: six-stichera
    properties:
      has_glory: true
emit:
  - section: lord_i_call
    component: stichera
    material:
      kind: hymn_set
      role: resurrectional
      title: Resurrectional stichera from the Octoechos
      attributes:
        tone: $day.tone
    count: 6
  - section: lord_i_call
    component: stichera
    observance: true
    count: 4
  - section: lord_i_call
    component: glory
    observance: true
  - section: lord_i_call
    component: both_now
    material:
      kind: theotokion
      role: dogmatikon
      title: Appointed theotokion
      attributes:
        tone: $day.tone
authority:
  - oca-ordinary-sunday-lord-i-call
