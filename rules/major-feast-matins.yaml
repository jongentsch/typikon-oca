schema: typikon.rule/v0.1

id: major-feast-matins

when:
  service: matins
  observance:
    rank: major-feast
    properties:
      major_feast: true

emit:
  - section: propers
    slot: feast
    material:
      source: official-service-bundle
      kind: feast-propers
      role: complete
      observance: $observance.id
      bundle: $observance.properties.matins_bundle
      reference: $observance.properties.matins_reference

authority:
  - oca-major-feast-service-bundles
