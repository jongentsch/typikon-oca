schema: typikon.rule/v0.1

id: major-feast-divine-liturgy

when:
  service: divine_liturgy
  observance:
    rank: major-feast
    properties:
      major_feast: true

emit:
  - section: propers
    slot: feast
    material:
      source: official-service-bundle
      kind: feast-propers
      role: complete
      observance: $observance.id
      bundle: $observance.properties.divine_liturgy_bundle
      reference: $observance.properties.divine_liturgy_reference

authority:
  - oca-major-feast-service-bundles
