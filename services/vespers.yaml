    name: Psalter
    components:
      - id: kathisma
        name: Appointed kathisma
        kind: changeable
        cardinality: optional
        accepts:
          - psalmody
      - id: little_litany
        name: Little Litany
        kind: fixed
        material:
          kind: fixed_text
          title: Little Litany
          citation: 'Vespers: Little Litany'
