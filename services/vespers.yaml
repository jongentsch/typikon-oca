authority:
  - oca-service-structures
sections:
  - id: opening
    name: Opening
    components:
      - id: opening_blessing
        name: Opening blessing
        kind: fixed
        material:
          kind: fixed_text
          title: Opening blessing
          citation: 'Horologion: Vespers, opening blessing'
      - id: come_let_us_worship
        name: Come, let us worship
        kind: fixed
        material:
          kind: fixed_text
          title: Come, let us worship
          citation: 'Horologion: invitatory'
      - id: psalm_103
        name: Psalm 103
        kind: fixed
        material:
          kind: fixed_text
          title: Psalm 103
          citation: 'Psalter: Psalm 103'
      - id: great_litany
        name: Great Litany
        kind: fixed
        material:
          kind: fixed_text
          title: Great Litany
          citation: 'Vespers: Litany of Peace'
