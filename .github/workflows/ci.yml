name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OCA pack
    runs-on: ubuntu-latest
    steps:
      - name: Check out OCA pack
        uses: actions/checkout@v6
        with:
          path: typikon-oca
      - name: Check out engine
        uses: actions/checkout@v6
        with:
          repository: jongentsch/typikon-engine
          path: typikon-engine
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate pack
        run: >-
          cargo run --locked --manifest-path typikon-engine/Cargo.toml
          -p typikon-cli -- validate typikon-oca
      - name: Compile dated lesser-saint case
        run: >-
          cargo run --locked --manifest-path typikon-engine/Cargo.toml
          -p typikon-cli -- compile-service
          --pack typikon-oca
          --date 2023-08-26
          --service great_vespers
      - name: Compile dated six-stichera case
        run: >-
          cargo run --locked --manifest-path typikon-engine/Cargo.toml
          -p typikon-cli -- compile-service
          --pack typikon-oca
          --date 2026-09-05
          --service great_vespers
      - name: Compile Nativity of Christ service cycle from date only
        run: >-
          cargo run --locked --manifest-path typikon-engine/Cargo.toml
          -p typikon-cli -- compile-date --pack typikon-oca --date 2026-12-25
      - name: Compile movable Pentecost service cycle
        run: >-
          cargo run --locked --manifest-path typikon-engine/Cargo.toml
          -p typikon-cli -- compile-date --pack typikon-oca --date 2026-05-31
